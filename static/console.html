<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenFix L1 Console</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --success-hover: #059669;
      --success-glow: rgba(16, 185, 129, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .tenant-badge {
      display: inline-block;
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-left: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 9999px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 0 0 var(--success-glow);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 var(--success-glow);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-count {
      background: #334155;
      color: #f8fafc;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .approvals-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .approval-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: border-color 0.2s ease;
    }

    .approval-card:hover {
      border-color: #475569;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ticket-badge {
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .time-badge {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .detail-value {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-approve {
      background: var(--success);
      color: #fff;
    }

    .btn-approve:hover:not(:disabled) {
      background: var(--success-hover);
    }

    .btn-reject {
      background: var(--danger);
      color: #fff;
    }

    .btn-reject:hover:not(:disabled) {
      background: var(--danger-hover);
    }

    .empty-state {
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state svg {
      margin-bottom: 12px;
      color: #475569;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 100;
    }

    .toast-success {
      background: #065f46;
      color: #a7f3d0;
      border: 1px solid #059669;
    }

    .toast-error {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #dc2626;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo-badge">⚡</div>
        <div>
          <h1>ScreenFix L1 Console <span class="tenant-badge">demo-msp</span></h1>
          <div class="subtitle">Live human approval queue for MSP support engineers</div>
        </div>
      </div>

      <div class="status-badge">
        <span class="pulse-dot"></span>
        Polling live (2s)
      </div>
    </div>

    <div class="section-title">
      <span>Pending Approvals</span>
      <span class="badge-count" id="countBadge">0</span>
    </div>

    <div class="approvals-list" id="approvalsList">
      <div class="empty-state" id="emptyState">
        <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p>No pending approvals. All sessions clear.</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const approvalsList = document.getElementById('approvalsList');
    const emptyState = document.getElementById('emptyState');
    const countBadge = document.getElementById('countBadge');
    const toast = document.getElementById('toast');

    function showToast(text, isError = false) {
      toast.textContent = text;
      toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      try {
        const d = new Date(isoString);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (e) {
        return isoString;
      }
    }

    async function handleDecision(approvalId, decision, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(`/api/approvals/${approvalId}/${decision}`, {
          method: 'POST'
        });
        if (!res.ok) throw new Error("Failed to submit decision");
        showToast(`Approval ${approvalId} ${decision === 'approve' ? 'Approved' : 'Rejected'}.`);
        fetchApprovals();
      } catch (err) {
        console.error(err);
        showToast("Error updating approval status", true);
        btn.disabled = false;
      }
    }

    async function fetchApprovals() {
      try {
        const res = await fetch('/api/approvals');
        if (!res.ok) return;
        const data = await res.json();
        const approvals = data.approvals || [];

        countBadge.textContent = approvals.length;

        if (approvals.length === 0) {
          approvalsList.innerHTML = '';
          approvalsList.appendChild(emptyState);
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        approvalsList.innerHTML = '';

        approvals.forEach(app => {
          const card = document.createElement('div');
          card.className = 'approval-card';
          card.innerHTML = `
            <div class="card-top">
              <span class="ticket-badge">${app.ticket_id || 'TKT-LIVE'}</span>
              <span class="time-badge">Requested: ${formatTime(app.created_at)}</span>
            </div>
            <div class="card-details">
              <div class="detail-item">
                <span class="detail-label">Runbook Skill</span>
                <span class="detail-value">${app.runbook_id}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Approved Action</span>
                <span class="detail-value"><code>${app.action_id}</code></span>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn btn-reject" data-id="${app.approval_id}" data-action="reject">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
                Reject
              </button>
              <button class="btn btn-approve" data-id="${app.approval_id}" data-action="approve">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
                Approve
              </button>
            </div>
          `;

          const approveBtn = card.querySelector('button[data-action="approve"]');
          const rejectBtn = card.querySelector('button[data-action="reject"]');

          approveBtn.onclick = () => handleDecision(app.approval_id, 'approve', approveBtn);
          rejectBtn.onclick = () => handleDecision(app.approval_id, 'reject', rejectBtn);

          approvalsList.appendChild(card);
        });

      } catch (err) {
        console.error("Error polling approvals:", err);
      }
    }

    // Initial fetch and 2-second interval poll
    fetchApprovals();
    setInterval(fetchApprovals, 2000);
  </script>
</body>
</html>
